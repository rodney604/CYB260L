# Revision number
# Date


# Description of what this change includes:
# Added an Amazon RDS MySQL database to the existing VPC.
# Added an RDS security group to control database access.
# Added a DB subnet group using the three existing VPC subnets.
#
# Revision number: 2
# Time: September 30, 2026


AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS CloudFormation template for CYB260L.
  Creates a Virtual Private Cloud (VPC) in the US-West-2 Region
  with three subnets distributed across three Availability Zones.
  Also creates an Amazon RDS MySQL database within the VPC.

Parameters:

  StudentID:
    Type: String
    Default: roddou0678
    Description: ECPI student ID used to identify the VPC.


Resources:

  # ------------------------------------------------------------
  # Main VPC
  # ------------------------------------------------------------
  StudentVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "VPC-${StudentID}"


  # ------------------------------------------------------------
  # Subnet in Availability Zone us-west-2a
  # ------------------------------------------------------------
  SubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StudentVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-west-2a
      Tags:
        - Key: Name
          Value: !Sub "VPC-${StudentID}-Subnet-AZ1"


  # ------------------------------------------------------------
  # Subnet in Availability Zone us-west-2b
  # ------------------------------------------------------------
  SubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StudentVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-west-2b
      Tags:
        - Key: Name
          Value: !Sub "VPC-${StudentID}-Subnet-AZ2"


  # ------------------------------------------------------------
  # Subnet in Availability Zone us-west-2c
  # ------------------------------------------------------------
  SubnetAZ3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StudentVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: us-west-2c
      Tags:
        - Key: Name
          Value: !Sub "VPC-${StudentID}-Subnet-AZ3"


  # ------------------------------------------------------------
  # Security Group for the RDS MySQL Database
  # ------------------------------------------------------------
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the CYB260L RDS database
      VpcId: !Ref StudentVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 10.0.0.0/16

      Tags:
        - Key: Name
          Value: !Sub "${StudentID}-RDS-SecurityGroup"


  # ------------------------------------------------------------
  # RDS DB Subnet Group
  # Allows RDS to use subnets across multiple Availability Zones
  # ------------------------------------------------------------
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: >
        Subnet group for the CYB260L RDS MySQL database.

      SubnetIds:
        - !Ref SubnetAZ1
        - !Ref SubnetAZ2
        - !Ref SubnetAZ3

      Tags:
        - Key: Name
          Value: !Sub "${StudentID}-RDS-SubnetGroup"


  # ------------------------------------------------------------
  # Amazon RDS MySQL Database
  # ------------------------------------------------------------
  RdsInstance:
    Type: AWS::RDS::DBInstance
    Properties:

      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId

      DBSubnetGroupName: !Ref RDSSubnetGroup

      AllocatedStorage: '5'

      DBInstanceClass: db.t3.micro

      DBInstanceIdentifier: playground-db

      Engine: MySQL

      MasterUsername: Admin

      MasterUserPassword: 'CloudAcademy123!'

      PubliclyAccessible: false

    DeletionPolicy: Delete


Outputs:

  VPCId:
    Description: ID of the newly created VPC.
    Value: !Ref StudentVPC


  VPCName:
    Description: Name assigned to the VPC.
    Value: !Sub "VPC-${StudentID}"


  VPCCIDR:
    Description: IPv4 CIDR block assigned to the VPC.
    Value: 10.0.0.0/16


  SubnetAZ1ID:
    Description: ID of the subnet in us-west-2a.
    Value: !Ref SubnetAZ1


  SubnetAZ2ID:
    Description: ID of the subnet in us-west-2b.
    Value: !Ref SubnetAZ2


  SubnetAZ3ID:
    Description: ID of the subnet in us-west-2c.
    Value: !Ref SubnetAZ3


  RDSSecurityGroupID:
    Description: Security group assigned to the RDS database.
    Value: !GetAtt RDSSecurityGroup.GroupId


  RDSSubnetGroupName:
    Description: DB subnet group used by the RDS database.
    Value: !Ref RDSSubnetGroup


  RDSInstanceIdentifier:
    Description: Identifier of the RDS MySQL database.
    Value: !Ref RdsInstance


  RDSEndpoint:
    Description: DNS endpoint of the RDS MySQL database.
    Value: !GetAtt RdsInstance.Endpoint.Address